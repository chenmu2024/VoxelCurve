name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use pinned npm
        run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm run security:audit
      - run: npm test
      - run: npm run build
      - run: npm run audit
